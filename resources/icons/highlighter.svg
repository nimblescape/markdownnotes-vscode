<!-- The source of the icons of the buttons "Show Highlights" and "Hide Highlights": a highlighter pen over the line that it draws. "Show Highlights" is this image; "Hide Highlights" adds a stroke from the top left to the bottom right with a gap on both sides. The script scripts/icon-font.py builds both into the icon font resources/notes-icons.ttf, which the package holds in place of this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="square">
  <!-- The pen, drawn upright and turned by 45 degrees: the body, the cone and the chisel tip with its ink. -->
  <g transform="rotate(45 8 8)">
    <path d="M5.5 0.5H10.5V8.5H5.5Z"/>
    <path d="M5.5 8.5L6.5 11H9.5L10.5 8.5"/>
    <path d="M6.5 11V13.5L9.5 12V11Z" fill="currentColor"/>
  </g>
  <!-- The line of the highlight. -->
  <rect x="1" y="13.5" width="14" height="1.5" fill="currentColor" stroke="none"/>
</svg>
