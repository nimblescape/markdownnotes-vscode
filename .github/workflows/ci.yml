# Test the extension and build its package for every push to main and every
# pull request, on the pinned Node.js 24 release (.node-version); VS Code 1.125
# (engines.vscode) and later run extensions on Node.js 24 too. The job "test"
# installs the locked development tools without install scripts, checks the
# types, runs the unit tests and the tests in a real VS Code (stable), and
# packages the VSIX with vsce, which first bundles the extension with esbuild
# and also validates the manifest and the README. It then packs the npm package
# of the formatter on the command line (scripts/npm-package.mjs) and runs the
# packed tool on Node.js 20, the oldest release that it supports. The VSIX and
# the npm package stay workflow artifacts for inspection.
# This workflow publishes nothing: the release workflow calls it for the commit
# of a version and publishes the VSIX and the npm package of that call. A change of this file
# changes the release process: its pull request needs a dry run (rule 4). The
# workflow "VS Code versions" calls it once per week with another VS Code
# version.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''
      vscode-version:
        description: The VS Code version of the tests in VS Code, "insiders" or a version such as 1.125.0; empty for stable.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

env:
  # The two calls of the workflow "VS Code versions" in one workflow run keep their artifacts apart. Empty for every
  # other run, so the release workflow finds the artifact "vsix".
  ARTIFACT_SUFFIX: ${{ inputs.vscode-version && format('-vscode-{0}', inputs.vscode-version) || '' }}

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      # .vscode-test.mjs takes the VS Code version from VSCODE_TEST_VERSION; empty gives stable.
      - name: Run the tests in VS Code
        env:
          VSCODE_TEST_VERSION: ${{ inputs.vscode-version }}
        run: xvfb-run -a npm run test:vscode

      - name: Build the VSIX package
        run: npm run package

      - name: Keep the VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix${{ env.ARTIFACT_SUFFIX }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Build the npm package of the command line tool
        run: npm run package:npm

      # The last steps of the job: the Node release of the steps after this one is 20.
      - name: Set up Node.js 20, the oldest release of the command line tool
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # The installed program formats the standard input and checks a formatted file.
      - name: Run the packed command line tool on Node.js 20
        run: |
          npm install --global --no-audit --no-fund ./*.tgz
          nimblescape-markdown-notes --version
          formatted=$(printf 'one\ntwo\n\n|a|b|\n|-|-|\n' | nimblescape-markdown-notes format -)
          expected=$(printf 'one two\n\n| a   | b   |\n| --- | --- |\n')
          if [ "$formatted" != "$expected" ]; then
            echo "::error::The command line tool formatted the text as: $formatted"
            exit 1
          fi
          printf '%s\n' "$formatted" > formatted.md
          nimblescape-markdown-notes format --check formatted.md

      - name: Keep the npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm${{ env.ARTIFACT_SUFFIX }}
          path: '*.tgz'
          if-no-files-found: error
